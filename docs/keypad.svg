<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>Phone keypad on the phalanges of four fingers</title>
  <rect width="700" height="400" fill="#ffffff"/>
  <!-- Palm side of the hand, fingers pointing right, 3 px per mm.
       Rows top to bottom: index, middle, ring, little. Phalanges from the palm to the tip. -->

  <!-- palm and wrist -->
  <path d="M0 150 C70 140 170 104 296 90 Q336 86 340 112 L342 330 Q338 352 304 348 C200 338 96 324 0 316 Z"
        fill="#f4f1ec" stroke="#cdc6bb" stroke-width="2"/>

  <!-- fingers: x = knuckle, lengths of the phalanges in px -->
  <g fill="#f4f1ec" stroke="#cdc6bb" stroke-width="2">
    <rect x="318" y="92"  width="252" height="56" rx="26"/>   <!-- index  40/24/19 mm -->
    <rect x="326" y="156" width="282" height="58" rx="27"/>   <!-- middle 45/28/20 mm -->
    <rect x="320" y="222" width="270" height="56" rx="26"/>   <!-- ring   42/27/20 mm -->
    <rect x="302" y="286" width="213" height="48" rx="22"/>   <!-- little 33/19/18 mm -->
  </g>
  <!-- joints -->
  <g stroke="#cdc6bb" stroke-width="1.6">
    <line x1="438" y1="98"  x2="438" y2="142"/><line x1="510" y1="98"  x2="510" y2="142"/>
    <line x1="461" y1="162" x2="461" y2="208"/><line x1="545" y1="162" x2="545" y2="208"/>
    <line x1="446" y1="228" x2="446" y2="272"/><line x1="527" y1="228" x2="527" y2="272"/>
    <line x1="401" y1="292" x2="401" y2="328"/><line x1="458" y1="292" x2="458" y2="328"/>
  </g>

  <!-- keys: digit and letters at the centre of each phalanx -->
  <g text-anchor="middle" fill="#16181d">
    <g font-size="22" font-weight="bold">
      <text x="378" y="122">1</text><text x="474" y="122">2</text><text x="540" y="122">3</text>
      <text x="393" y="187">4</text><text x="503" y="187">5</text><text x="576" y="187">6</text>
      <text x="383" y="252">7</text><text x="486" y="252">8</text><text x="558" y="252">9</text>
      <text x="351" y="313">*</text><text x="429" y="313">0</text><text x="486" y="313">#</text>
    </g>
    <g font-size="11" fill="#6b6459">
      <text x="378" y="138">.</text><text x="474" y="138">abc</text><text x="540" y="138">def</text>
      <text x="393" y="203">ghi</text><text x="503" y="203">jkl</text><text x="576" y="203">mno</text>
      <text x="383" y="268">pqrs</text><text x="486" y="268">tuv</text><text x="558" y="268">wxyz</text>
      <text x="351" y="327">next</text><text x="429" y="327">space</text><text x="486" y="327">⌫</text>
    </g>
  </g>

  <!-- the two magnetometers, on the back of the hand behind the knuckles (dashed = other side) -->
  <g fill="none" stroke="#2c56c9" stroke-width="2" stroke-dasharray="5 4">
    <rect x="246" y="112" width="42" height="34" rx="6"/>
    <rect x="252" y="292" width="42" height="34" rx="6"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#2c56c9" text-anchor="middle">
    <text x="267" y="134">S1</text><text x="273" y="314">S2</text>
  </g>
  <g stroke="#2c56c9" stroke-width="1.2">
    <line x1="230" y1="129" x2="230" y2="309"/>
    <line x1="224" y1="129" x2="236" y2="129"/><line x1="224" y1="309" x2="236" y2="309"/>
  </g>

  <!-- thumb: from the base of the palm (index side) towards the fingers, magnet on the nail -->
  <path d="M34 160 C58 96 132 52 222 32 C268 22 318 18 344 30 Q362 46 348 64 C306 72 262 78 222 88 C176 100 138 124 118 160 Z"
        fill="#f4f1ec" stroke="none"/>
  <path d="M34 160 C58 96 132 52 222 32 C268 22 318 18 344 30 Q362 46 348 64 C306 72 262 78 222 88 C176 100 138 124 118 160"
        fill="none" stroke="#cdc6bb" stroke-width="2"/>
  <path d="M212 40 Q222 62 222 86" fill="none" stroke="#cdc6bb" stroke-width="1.4"/>
  <ellipse cx="322" cy="44" rx="20" ry="13" fill="#ebe4d9" stroke="#cdc6bb" stroke-width="1.4"/>
  <rect x="309" y="37" width="26" height="14" rx="3" fill="#2c56c9"/>
  <text x="322" y="48" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
</svg>
